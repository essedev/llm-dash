[project]
name = "llm-dash"
version = "0.1.0"
description = "Control panel and web chat for local LLMs on Apple Silicon, on top of mlx_lm.server"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "psutil>=7.2.2",
    "sse-starlette>=3.4.1",
    "uvicorn>=0.46.0",
]
