# llm-dash.toml - single source of truth for profiles and server settings.
# Read by: bin/llm-serve (via bin/_config.py) and main.py (via tomllib).
# To add or remove a model: edit this file, then follow docs/MODEL_SYNC.md.

[server]
llm_port = 1234
dash_port = 1230
models_dir = "~/.lmstudio/models"
wired_limit_mb = 28000
# Profile used by llm-up, llm-serve and make up when none is given.
default_profile = "coder"

[hardware]
pressure_high_percent = 88
pressure_medium_percent = 72
swap_high_gb = 8
swap_medium_gb = 2

# Default tier: agentic MoE models, tool calling parsed by mlx_lm.server.

[profiles.coder]
label = "Qwen3.6-35B-A3B-UD"
tag = "coder (default)"
path = "unsloth/Qwen3.6-35B-A3B-UD-MLX-4bit"
size_gb = 20
ctx = 65536
tier = "default"
note = "SWE-bench 73.4%, ~25-27 t/s"

[profiles.coder.chat_template_args]
enable_thinking = true

# Other tier: startable, but not agentic daily drivers (see docs/MODELS.md).

[profiles.qwen35-9b]
label = "Qwen3.5-9B"
tag = "altri · piccolo"
path = "mlx-community/Qwen3.5-9B-MLX-4bit"
size_gb = 6
ctx = 32768
tier = "other"
note = "leggero, sotto la soglia agentic affidabile"

[profiles.qwen38]
label = "Qwen3.8-27B"
tag = "altri · dense"
path = "lmstudio-community/Qwen3.8-27B-MLX-4bit"
size_gb = 15
ctx = 262144
tier = "other"
note = "tool calling ok, ~7 t/s: no daily driver agentico"

[profiles.qwen38.chat_template_args]
enable_thinking = false
